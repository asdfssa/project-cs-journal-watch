name: journal_watch

services:
  # backend + frontend (Angular build ถูก copy เข้า image แล้วเสิร์ฟด้วย Express)
  backend:
    build:
      context: ./backend
      additional_contexts:
        frontend: ./frontend
    container_name: journal_watch_backend
    restart: unless-stopped
    # tini เป็น PID 1 — เก็บกวาด process ลูกของ Chromium ที่ถูกทิ้ง (ไม่งั้นค้างเป็น zombie ทุกครั้งที่ scrape)
    init: true
    env_file:
      - ./backend/.env
    environment:
      PORT: 3000
      # DB รันแยกที่ db-stack/ (พอร์ต 3306 บนเครื่อง host) — ใน container ต้องใช้ host.docker.internal ไม่ใช่ 127.0.0.1
      # ค่าที่ทับ DB_HOST/DB_PORT ใน backend/.env เฉพาะตอนรันใน Docker (รันตรงๆ ยังใช้ค่าใน .env)
      DB_HOST: host.docker.internal
      DB_PORT: 3306
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 13002 ไว้ทดสอบจากเครื่องนี้ (http://127.0.0.1:13002) — bind แค่ localhost กันเครื่องอื่นใน LAN
      # ต่อตรงโดยไม่ผ่าน Cloudflare (ปลอม X-Forwarded-For หลบ rate limit ได้) ทางเข้าจริงคือ cloudflared ด้านล่าง
      - "127.0.0.1:13002:3000"
      # noVNC ไม่มีรหัสผ่าน (x11vnc -nopw) — bind แค่ localhost กันเปิดออกอินเทอร์เน็ต
      - "127.0.0.1:15902:5900"
      - "127.0.0.1:6082:6080"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data

  # Cloudflare tunnel journal-watch → https://journal.farmlnwza007.online
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: journal_watch_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend
